backend:
  name: github
  repo: 3049024389-qlr/J0J0-portfolio
  branch: main

media_folder: "images"
public_folder: "/images"

local_backend: true

collections:
  - name: "projects"
    label: "项目"
    folder: "src/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    media_folder: "/images/{{slug}}"
    public_folder: "/images/{{slug}}"
    fields:
      - { label: "布局", name: "layout", widget: "hidden", default: "project.html" }
      - { label: "项目全称", name: "title", widget: "string" }
      - { label: "副标题", name: "subtitle", widget: "string" }
      - { label: "设计时间（显示用）", name: "period", widget: "string", hint: "如：2026.03–06" }
      - { label: "排序", name: "order", widget: "number", default: 99, hint: "数字越小越靠前" }
      - { label: "项目地点", name: "location", widget: "string" }
      - { label: "建筑面积", name: "area", widget: "string", hint: "如：14200㎡" }
      - { label: "指导老师", name: "instructor", widget: "string" }
      - label: "团队角色"
        name: "role"
        widget: "select"
        options: ["独立完成", "组长", "副组长", "组员"]
      - { label: "封面图", name: "cover", widget: "image", hint: "首页展示用，建议比例 16:7" }
      - { label: "项目简介", name: "description", widget: "text", required: false, hint: "显示在详情页文字区，支持换行" }
      - label: "内容块"
        name: "blocks"
        widget: "list"
        types:
          - label: "效果图组"
            name: "render_group"
            widget: "object"
            fields:
              - label: "图片列表"
                name: "images"
                widget: "list"
                fields:
                  - { label: "图片", name: "src", widget: "image" }
                  - { label: "图名", name: "caption", widget: "string" }
                  - label: "宽度"
                    name: "width"
                    widget: "select"
                    default: "auto"
                    options:
                      - { label: "自动", value: "auto" }
                      - { label: "全宽", value: "full" }
                      - { label: "半宽", value: "half" }
                      - { label: "三分之一宽", value: "third" }
                  - { label: "自定义宽度（%）", name: "customWidth", widget: "number", required: false }
                  - label: "对齐"
                    name: "align"
                    widget: "select"
                    default: "left"
                    required: false
                    options:
                      - { label: "居左", value: "left" }
                      - { label: "居中", value: "center" }
                      - { label: "居右", value: "right" }
          - label: "技术图纸组"
            name: "drawing_group"
            widget: "object"
            fields:
              - label: "图片列表"
                name: "images"
                widget: "list"
                fields:
                  - { label: "图片", name: "src", widget: "image" }
                  - { label: "图名", name: "caption", widget: "string" }
                  - label: "宽度"
                    name: "width"
                    widget: "select"
                    default: "auto"
                    options:
                      - { label: "自动", value: "auto" }
                      - { label: "全宽", value: "full" }
                      - { label: "半宽", value: "half" }
                  - { label: "自定义宽度（%）", name: "customWidth", widget: "number", required: false }
          - label: "草稿与细节组"
            name: "sketch_group"
            widget: "object"
            fields:
              - label: "图片列表"
                name: "images"
                widget: "list"
                fields:
                  - { label: "图片", name: "src", widget: "image" }
                  - { label: "图名", name: "caption", widget: "string" }
                  - label: "宽度"
                    name: "width"
                    widget: "select"
                    default: "auto"
                    options:
                      - { label: "自动", value: "auto" }
                      - { label: "全宽", value: "full" }
                      - { label: "半宽", value: "half" }
          - label: "超宽图"
            name: "wide_image"
            widget: "object"
            fields:
              - { label: "图片", name: "src", widget: "image" }
              - { label: "图名", name: "caption", widget: "string" }
          - label: "文字块"
            name: "text_block"
            widget: "object"
            fields:
              - { label: "标题（可留空）", name: "heading", widget: "string", required: false }
              - { label: "正文", name: "text", widget: "text" }
          - label: "时间轴"
            name: "timeline"
            widget: "object"
            fields:
              - label: "时间节点列表"
                name: "nodes"
                widget: "list"
                fields:
                  - { label: "日期", name: "date", widget: "string", hint: "如：2026.03.01" }
                  - { label: "阶段标题", name: "heading", widget: "string" }
                  - { label: "正文", name: "text", widget: "text", required: false }
                  - label: "配图（可选）"
                    name: "image"
                    widget: "object"
                    required: false
                    fields:
                      - { label: "图片", name: "src", widget: "image" }
                      - { label: "图名", name: "caption", widget: "string" }